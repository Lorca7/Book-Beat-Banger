name: Build macOS app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run smoke test
        run: node scripts/smoke-test.js

  macos:
    runs-on: macos-15
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build universal .dmg and .zip (ad-hoc signed)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify signature
        run: |
          codesign --verify --deep --verbose=2 "dist/mac-universal/Book Beat Banger.app"
          lipo -archs "dist/mac-universal/Book Beat Banger.app/Contents/MacOS/Book Beat Banger"
      - uses: actions/upload-artifact@v4
        with:
          name: Book-Beat-Banger-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    # Publishes the built .dmg/.zip as a GitHub Release: on every push to main (tagged
    # v<package.json version>, skipped if that release already exists) or when a v* tag is pushed.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Book-Beat-Banger-macOS
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Book Beat Banger** is a book-themed 4-track sampling drum machine with mic recording, a granular synth, per-track effects, 4 LFOs, automation and WAV export.
          It is a universal build for macOS 12+ (tested for Sonoma 14.6) and runs on Apple Silicon and Intel.

          ### Install
          1. Download the `.dmg`, open it and drag **Book Beat Banger** into Applications.
          2. The first time, right-click the app, choose **Open**, then **Open** again. The app is ad-hoc signed, not notarized.
          3. If macOS says the app "is damaged", run this once in Terminal:
             `xattr -dr com.apple.quarantine "/Applications/Book Beat Banger.app"`
          4. Allow microphone access so you can record your own samples.
          NOTES
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - bump the version in package.json to publish a new one."; exit 0
          fi
          gh release create "$TAG" dist/*.dmg dist/*.zip --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Book Beat Banger $TAG" --notes-file notes.md
